<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miratshikan Dictionary (Слэвкнига Мирачиканы)</title>
<link rel="stylesheet" href="css/style.css">

<link rel="icon" type="image/x-icon" href="assets/favicon/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

<body>

<header>
  <h1>Miratshikan Dictionary</h1>
  <h2>Слэвкнига Мирачиканы</h2>
  <p>Search in English or Miratshikan</p>
  <p>Ускамитя во Мирачиканы или Ангилны</p>
</header>

<main>
  <input id="search" type="text" placeholder="e.g. earth, тэра, tèra…" autocomplete="off">
  <div id="count"></div>
  <div id="results"></div>
  <button id="load-more" type="button" hidden>Load more</button>
  <div id="empty">No matches. Try a different spelling.</div>
</main>

<footer>
  <a href="https://github.com/Miratshikan-Language-Council/dictionary" target="_blank" rel="noopener">
    Source Code
  </a>
  <span>·</span>
  <a href="https://github.com/Miratshikan-Language-Council/dictionary/blob/main/docs/database/db.json" target="_blank" rel="noopener">
    Dictionary Database
  </a>
  <p>AI was used in the creation of this website.</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
